/* 两侧面板显示 / 隐藏：点屏边竖条，或按 [ 收左侧、] 收右侧、H 一起收/放。
   状态存 localStorage，刷新和单文件版都记得上次的选择。 */
(function(){
  var KEY='terrain.panel', st={l:1,r:1};
  try{
    var s=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(s&&typeof s==='object'){ if(s.l===0||s.l===1)st.l=s.l; if(s.r===0||s.r===1)st.r=s.r; }
  }catch(e){}
  var bL=document.getElementById('tgL'), bR=document.getElementById('tgR');
  if(!bL||!bR) return;
  function apply(){
    document.body.classList.toggle('hideL',!st.l);
    document.body.classList.toggle('hideR',!st.r);
    bL.textContent=st.l?'‹':'›';
    bR.textContent=st.r?'›':'‹';
    bL.title=(st.l?'隐藏信息栏':'展开信息栏')+'（[）';
    bR.title=(st.r?'隐藏控制台':'展开控制台')+'（]）';
    bL.setAttribute('aria-expanded',st.l?'true':'false');
    bR.setAttribute('aria-expanded',st.r?'true':'false');
    try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){}
  }
  function flip(side,on){ st[side]=on?1:0; apply(); }
  bL.addEventListener('click',function(){ flip('l',!st.l); });
  bR.addEventListener('click',function(){ flip('r',!st.r); });
  addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    var t=e.target, tag=t&&t.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable)) return;
    if(e.key==='['){ flip('l',!st.l); e.preventDefault(); }
    else if(e.key===']'){ flip('r',!st.r); e.preventDefault(); }
    else if(e.key==='h'||e.key==='H'){
      var open=!(st.l&&st.r); st.l=open?1:0; st.r=open?1:0; apply(); e.preventDefault();
    }
  });
  apply();
})();
</script>

const el = id => document.getElementById(id);
const MIN = M.elev_min, MAX = M.elev_max;
/* 非绿色调色板：按高程分层。当前为 11 月华北山地枯黄/赭褐/裸岩观感 */
const PALETTES = {
  autumn:[[0,[.20,.17,.14]],[.28,[.35,.28,.21]],[.55,[.58,.46,.31]],
          [.78,[.72,.63,.48]],[1,[.86,.82,.73]]],
  loess: [[0,[.26,.20,.14]],[.30,[.52,.38,.22]],[.58,[.76,.60,.34]],
          [.80,[.87,.76,.52]],[1,[.95,.91,.80]]],

let ART = true, PAL = 'autumn';
const Q0 = new URLSearchParams(location.search);
if(Q0.has('art'))ART = Q0.get('art') !== 'sat';
if(Q0.has('pal') && PALETTES[Q0.get('pal')])PAL = Q0.get('pal');
else try{
  const a=JSON.parse(localStorage.getItem('terrain_hd_art_v1')||'{}');
  if(!Q0.has('art') && typeof a.art==='boolean')ART=a.art;

}catch(e){}

  const S = PALETTES[PAL] || PALETTES.autumn;
  const t = Math.max(0,Math.min(1,(e-MIN)/Math.max(1e-6,MAX-MIN)));
  for(let k=0;k<S.length-1;k++){

    if(t<=t1){const f=(t-t0)/(t1-t0);return c0.map((v,j)=>v+(c1[j]-v)*f);}

 ['轮廓位移', M.offset_m[0]+' / +'+M.offset_m[1]+' m'],
 ['范围', M.bbox_wgs84[0].toFixed(5)+' – '+M.bbox_wgs84[2].toFixed(5)+' E'],
 ['', M.bbox_wgs84[1].toFixed(5)+' – '+M.bbox_wgs84[3].toFixed(5)+' N'],

 ['裁切', '轨迹外接 +'+M.expand_m+' m / 每边'],
 ['高程', Math.round(MIN)+' – '+Math.round(MAX)+' m'],

el('src').textContent = M.dem+' · '+M.imagery;

const scene = new THREE.Scene();
const BG0 = ART ? 0xffffff : 0xf4f6f9;
scene.background = new THREE.Color(BG0);
scene.fog = new THREE.Fog(BG0, 3200, 8000);
const camera = new THREE.PerspectiveCamera(44, innerWidth/innerHeight, 1, 16000);
const DIAG = Math.hypot(M.width_m, M.height_m);   // 模型对角线：窗口裁切后按它等比定相机距离
const HOME = new THREE.Vector3(DIAG*0.78, DIAG*0.876, -DIAG*0.96);
camera.position.copy(HOME);

renderer.setSize(innerWidth,innerHeight);

controls.target.set(0,(MAX-MIN)*0.55,0);

controls.dampingFactor = 0.08;

controls.minDistance = 200;
controls.maxDistance = 8000;

const N = D.verts.length;

/* 陡坡压暗，增强插画沙盘的块面层次（grid 顶点顺序 i*(NY+1)+j） */
function slopeShade(k){
  if(k>=NG)return 1;
  const i=Math.floor(k/NGY), j=k%NGY;
  const h=(a,b)=>D.verts[a*NGY+b][1];
  const dx=(h(Math.min(i+1,NGX-1),j)-h(Math.max(i-1,0),j))/(2*M.width_m/(NGX-1));
  const dz=(h(i,Math.min(j+1,NGY-1))-h(i,Math.max(j-1,0),j))/(2*M.height_m/(NGY-1));

  g.setAttribute('color',new THREE.BufferAttribute(col,3));

function rrShape(w,h,r){

bdG.visible=false;
group.add(bdW,bdG);

const wf = new THREE.LineSegments(new THREE.WireframeGeometry(topGeo),
  new THREE.LineBasicMaterial({color:0x37618f,transparent:true,opacity:.13,depthWrite:false}));
wf.visible=false; group.add(wf);
const grid = new THREE.GridHelper(M.width_m*1.6,18,0xc7d2e0,0xdce3ed);
grid.position.y = M.base_m - 2; group.add(grid);

let contour = null;
function buildContours(interval){
  if(contour){group.remove(contour);contour.geometry.dispose();}
  const out=[],levels=[];
  for(let L=Math.ceil(MIN/interval)*interval;L<MAX;L+=interval)levels.push(L);
  for(const t of D.top_tris){
    const p=[D.verts[t[0]],D.verts[t[1]],D.verts[t[2]]];
    const h=[D.elev[t[0]],D.elev[t[1]],D.elev[t[2]]];
    for(const L of levels){
      const pts=[];
      for(let e=0;e<3;e++){
        const a=e,b=(e+1)%3;
        if((h[a]<L&&h[b]>=L)||(h[b]<L&&h[a]>=L)){
          const f=(L-h[a])/(h[b]-h[a]);
          pts.push([p[a][0]+(p[b][0]-p[a][0])*f,
                    p[a][1]+(p[b][1]-p[a][1])*f+2.5,
                    p[a][2]+(p[b][2]-p[a][2])*f]);
        }
      }
      if(pts.length===2)out.push(...pts[0],...pts[1]);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(out,3));
  contour=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x2b3d55,transparent:true,opacity:.6,depthWrite:false}));
  contour.visible=el('showCt').checked;
  group.add(contour);
}
buildContours(30);

group.scale.y = EX0;
syncBase();
el('ex').value=EX0; el('exVal').textContent=EX0.toFixed(1)+'×';

/* 插画沙盘 / 卫星写实：切换背景、光照、辅助线、底座与配色 */
function applyArt(){
  document.body.classList.toggle('art',ART);
  el('artMode').value=ART?'art':'sat';
  el('pal').value=PAL;
  const bg=ART?0xffffff:0xf4f6f9;
  scene.background.setHex(bg); scene.fog.color.setHex(bg);
  baseGroup.visible=ART&&el('base').checked;
  grid.visible=!ART;
  bdW.visible=!ART&&el('showBd').checked;
  bdG.visible=!ART&&el('showRaw').checked;
  wf.visible=!ART&&el('showWf').checked;
  if(contour)contour.visible=!ART&&el('showCt').checked;
  ambient.intensity=ART?1.05:1.35;
  sun.intensity=ART?1.35:1.7;
  sun.color.setHex(ART?0xfff1dc:0xffffff);
  const low=(PALETTES[PAL]||PALETTES.autumn)[0][1];
  shellMat.color.setRGB(low[0]*1.1+.08,low[1]*1.1+.08,low[2]*1.1+.08);
  recolor(); applyMode();
  try{localStorage.setItem('terrain_hd_art_v1',
    JSON.stringify({art:ART,pal:PAL,base:el('base').checked,ex:+el('ex').value}));}catch(e){}
}
el('artMode').onchange=e=>{ART=e.target.value==='art';applyArt();};
el('pal').onchange=e=>{PAL=e.target.value;applyArt();};
el('base').onchange=applyArt;
el('ex').oninput=e=>{const v=+e.target.value;group.scale.y=v;
  el('exVal').textContent=v.toFixed(1)+'×';syncBase();
  try{const a=JSON.parse(localStorage.getItem('terrain_hd_art_v1')||'{}');
      a.ex=v;localStorage.setItem('terrain_hd_art_v1',JSON.stringify(a));}catch(err){}};
el('ct').oninput=e=>{const v=+e.target.value;el('ctVal').textContent=v+' m';buildContours(v);};
el('sat').onchange=applyMode;
el('showCt').onchange=e=>{if(contour)contour.visible=!ART&&e.target.checked;};
el('showBd').onchange=e=>{bdW.visible=!ART&&e.target.checked;};
el('showRaw').onchange=e=>{bdG.visible=!ART&&e.target.checked;};
el('showWf').onchange=e=>{wf.visible=!ART&&e.target.checked;};
el('autoRot').onchange=e=>{controls.autoRotate=e.target.checked;};
el('reset').onclick=()=>{camera.position.copy(HOME);controls.target.set(0,(MAX-MIN)*0.55,0);controls.update();};
el('topView').onclick=()=>{location.href=location.pathname+'?top=1';};
if(location.search.indexOf('top')>=0){
  el('topView').textContent='返回 3D 视角';
  el('topView').onclick=()=>{location.href=location.pathname;};
}
applyArt();

function exportGroup(){
  const g=new THREE.Group();
  const t=topMesh.clone();
  t.material=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.95,side:THREE.DoubleSide});
  g.add(t,shellMesh.clone());
  g.scale.y=group.scale.y;
  g.updateMatrixWorld(true);
  return g;
}
function download(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
el('stl').onclick=()=>{
  const r=new STLExporter().parse(exportGroup(),{binary:true});
  download(new Blob([r],{type:'model/stl'}),'terrain_hd.stl');
};
el('glb').onclick=()=>{
  new GLTFExporter().parse(exportGroup(),
    r=>download(new Blob([r],{type:'model/gltf-binary'}),'terrain_hd.glb'),
    e=>console.error(e),{binary:true});
};
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
el('status').style.display='none';
(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
</script>
</body>
</html>
